name: Build USSL APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'capacitor.config.ts'
      - 'android-package.json'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v4
      - name: Prepare Capacitor Android project
        run: |
          cp android-package.json package.json
          npm install --no-audit --no-fund
          mkdir -p www
          cp index.html style.css app.js manifest.webmanifest service-worker.js icon.svg www/
          npx cap add android
          npx cap sync android
      - name: Add Android permissions for audio and video calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          permissions = '''    <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
          '''
          source = source.replace('    <application', permissions + '    <application', 1)
          manifest.write_text(source)
          PY
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: USSL-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
